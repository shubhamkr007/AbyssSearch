# Render Blueprint — demo API Gateway (free tier)
# Sync via Dashboard: New > Blueprint > connect repo, or use Render CLI.
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: abyss-api-gateway
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: NODE_ENV=development npx pnpm@9.15.9 install && npx pnpm@9.15.9 --filter @enterprise-search/api-gateway build
    startCommand: NODE_ENV=production node services/api-gateway/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: USE_FAKE
        value: "true"
      - key: CORS_STRICT
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: RAG_ENABLED
        value: "false"
      - key: ANALYTICS_ENABLED
        value: "false"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
