# Render Blueprint — demo API Gateway (free tier)
# Dashboard: New > Blueprint > connect this repo.
# Delete the duplicate manual service "abyss-api-gateway" if it exists.
# If you keep it, set Build Command to: bash scripts/render-build-gateway.sh

services:
  - type: web
    name: abyss-search-gateway
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: bash scripts/render-build-gateway.sh
    startCommand: NODE_ENV=production node services/api-gateway/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: USE_FAKE
        value: "true"
      - key: CORS_STRICT
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: RAG_ENABLED
        value: "false"
      - key: ANALYTICS_ENABLED
        value: "false"
      - key: NODE_VERSION
        value: "20"
