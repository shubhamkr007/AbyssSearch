<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AbyssSearch — Widget Demo (live API)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1f2328; }
      .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { text-align: center; font-size: 1.75rem; }
      .banner {
        background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
        padding: 14px 16px; font-size: 14px; color: #4b5563; margin-bottom: 28px;
      }
      .banner a { color: #2563eb; }
      .status { margin-top: 8px; font-size: 13px; }
      .status.warn { color: #b45309; }
      .status.ok { color: #15803d; }
      .status.err { color: #b91c1c; }
      code { background: #e5e7eb; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>AbyssSearch — Live API</h1>
      <p class="banner">
        Hits the <strong>API Gateway</strong> on Render (<code>USE_FAKE=true</code>).
        Free tier spins down after ~15 min idle — first request may take 30–60s.
        <a href="index.html">Back to offline demo</a>
      </p>
      <p id="status" class="status warn">Warming up gateway…</p>

      <enterprise-search id="widget" tenant-key="pk_test_demo" placeholder="Search via live gateway…">
      </enterprise-search>
    </div>
    <script type="module" src="./enterprise-search.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const apiBase = params.get('api') || 'https://abyss-api-gateway.onrender.com';
      const tenantKey = params.get('key') || 'pk_test_demo';
      const status = document.getElementById('status');
      const widget = document.getElementById('widget');

      widget.setAttribute('api-base', apiBase);
      widget.setAttribute('tenant-key', tenantKey);
      status.textContent = `Gateway: ${apiBase} · key: ${tenantKey}`;

      fetch(`${apiBase.replace(/\/$/, '')}/healthz`)
        .then((r) => {
          status.className = r.ok ? 'status ok' : 'status err';
          status.textContent = r.ok
            ? `Gateway healthy at ${apiBase}`
            : `Gateway returned HTTP ${r.status} — try again in a moment`;
        })
        .catch(() => {
          status.className = 'status warn';
          status.textContent = `Gateway cold-starting at ${apiBase} — wait ~30s and search`;
        });
    </script>
  </body>
</html>
